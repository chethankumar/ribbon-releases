<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ribbon</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0b12;color:#eee;font:16px/1.5 -apple-system,system-ui,sans-serif;padding:16px}
  main{max-width:520px;text-align:center}
  h1{font-size:44px;margin:0 0 8px;background:linear-gradient(90deg,#8561ff,#33c7ff);-webkit-background-clip:text;color:transparent}
  a.button{display:inline-block;margin-top:20px;padding:12px 26px;border-radius:999px;background:linear-gradient(90deg,#8561ff,#33c7ff);color:#fff;text-decoration:none;font-weight:600}
  p{color:#aab}
</style></head>
<body><main>
  <h1>Ribbon</h1>
  <p>A scrolling window manager for macOS. Every window has its own place on one long strip; nothing overlaps, and opening a window never shrinks the others.</p>
  <a class="button" href="https://github.com/chethankumar/ribbon-releases/releases/latest">Download for macOS</a>
  <p style="font-size:13px;margin-top:18px">Requires macOS 14 or later. Ribbon updates itself.</p>
</main></body></html>
